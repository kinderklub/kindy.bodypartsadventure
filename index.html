              '0%, 100%': { transform: 'translateY(0)' },

      }

    // Web Audio Synthesizer
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playSuccess() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      },
      playMistake() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = "triangle";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      },
      playPop() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    };

                <img id="characterImage" src="${charUrl}" alt="Child Character" class="h-full w-auto max-w-full object-contain filter drop-shadow-2xl pointer-events-none select-none" onerror="handleImgError(this, 'character', '${selectedCharacter}')">
                <!-- Target markers dynamically attached -->
              </div>
            </div>

          </div>

          <!-- Bottom Accessible Helper Notice (Fully localized) -->
          <div class="mt-2 text-center text-xs font-semibold text-candy-cream/70">
            <span id="helperTipText">${t.helperTip}</span>
          </div>

        </div>
      `;

      activeSvgOverlay = document.getElementById('connectionSvg');
      document.getElementById('btnExitSession').onclick = () => {
        AudioEngine.playPop();
        renderHomeView();
      };

      setupCardsAndMarkers();
      window.addEventListener('resize', recalculateConnections);
    }

    function setupCardsAndMarkers() {
      const cardsContainer = document.getElementById('cardsSourceContainer');
      const charBox = document.getElementById('characterBox');
      cardsContainer.innerHTML = '';

      // 1. Generate Body Part Cards
      activeTaskItems.forEach(item => {
        const card = document.createElement('div');
        card.className = "candy-card p-2 md:p-3 rounded-2xl flex items-center gap-2.5 cursor-grab active:cursor-grabbing transition-transform hover:scale-105 active:scale-95 touch-none relative";
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', getPartLabel(item.data));

        const img = document.createElement('img');
        img.src = item.data.url;
        img.alt = getPartLabel(item.data);
        img.className = "w-12 h-12 md:w-14 md:h-14 object-contain rounded-xl bg-candy-dark/60 p-1 pointer-events-none border border-candy-yellow/40";
        img.onerror = () => handleImgError(img, 'part', item.key);

        const label = document.createElement('span');
        label.className = "font-extrabold text-sm md:text-base text-candy-cream pr-1 select-none pointer-events-none";
        label.textContent = getPartLabel(item.data);

        const pip = document.createElement('div');
        pip.className = "pip-dot w-3.5 h-3.5 rounded-full bg-candy-yellow border-2 border-white pointer-events-none shadow";

        card.appendChild(img);
        card.appendChild(label);
        card.appendChild(pip);

        cardsContainer.appendChild(card);
        item.sourceEl = card;

        attachDragEvents(card, item);

        card.addEventListener('click', (e) => {
          if (isDragging || isTransitioningQuestion) return;
          handleAccessibleSelect(item);
        });
      });

      // 2. Position Target Markers on Character
      activeTaskItems.forEach(item => {
        const marker = document.createElement('div');
        marker.className = "absolute z-30 w-11 h-11 md:w-12 md:h-12 flex items-center justify-center cursor-pointer transition-transform hover:scale-110 active:scale-95";
        marker.setAttribute('role', 'button');
        marker.setAttribute('aria-label', `${I18N[currentLang].targetAria} ${getPartLabel(item.data)}`);

        const targetImg = document.createElement('img');
        targetImg.src = ASSETS.tools.targetMarker;
        targetImg.className = "w-full h-full object-contain target-marker-pulse pointer-events-none filter drop-shadow";
        targetImg.onerror = () => handleImgError(targetImg, 'target', item.key);

        marker.appendChild(targetImg);

        const rx = item.data.targetRatio.x * 100;
        const ry = item.data.targetRatio.y * 100;
        marker.style.left = `${rx}%`;
        marker.style.top = `${ry}%`;
        marker.style.transform = 'translate(-50%, -50%)';

        marker.addEventListener('click', () => {
          if (accessibleSelectedSource && !isTransitioningQuestion) {
            evaluateMatch(accessibleSelectedSource, item.key);
          }
        });

        charBox.appendChild(marker);
        item.targetEl = marker;
      });
    }

    let accessibleSelectedSource = null;
    function handleAccessibleSelect(item) {
      if (item.connected || isTransitioningQuestion) return;
      AudioEngine.playPop();
      if (accessibleSelectedSource === item) {
        item.sourceEl.classList.remove('ring-4', 'ring-candy-cyan');
        accessibleSelectedSource = null;
        return;
      }
      if (accessibleSelectedSource) {
        accessibleSelectedSource.sourceEl.classList.remove('ring-4', 'ring-candy-cyan');
      }
      accessibleSelectedSource = item;
      item.sourceEl.classList.add('ring-4', 'ring-candy-cyan');
      setMascotMessage(ASSETS.mascot.pointing, I18N[currentLang].tapTargetInstruction);
    }

    function attachDragEvents(cardEl, taskItem) {
      cardEl.addEventListener('pointerdown', (e) => {
        if (taskItem.connected || isTransitioningQuestion) return;
        e.preventDefault();
        cardEl.setPointerCapture(e.pointerId);

        isDragging = true;
        dragSourceItem = taskItem;
        cardEl.classList.add('scale-105', 'ring-4', 'ring-candy-yellow');
        AudioEngine.playPop();

        const playRect = document.getElementById('playArea').getBoundingClientRect();
        const pip = cardEl.querySelector('.pip-dot') || cardEl;
        const pipRect = pip.getBoundingClientRect();

        dragStartPoint = {
          x: (pipRect.left + pipRect.width / 2) - playRect.left,
          y: (pipRect.top + pipRect.height / 2) - playRect.top
        };

        if (tempSvgLine) tempSvgLine.remove();
        tempSvgLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempSvgLine.setAttribute('fill', 'none');
        tempSvgLine.setAttribute('stroke', '#FFD200');
        tempSvgLine.setAttribute('stroke-width', '6');
        tempSvgLine.setAttribute('stroke-linecap', 'round');
        tempSvgLine.setAttribute('stroke-dasharray', '8 6');
        tempSvgLine.setAttribute('filter', 'drop-shadow(0 0 8px rgba(255,210,0,0.8))');
        activeSvgOverlay.appendChild(tempSvgLine);

        updateTempLine(e.clientX - playRect.left, e.clientY - playRect.top);
      });

      cardEl.addEventListener('pointermove', (e) => {
        if (!isDragging || dragSourceItem !== taskItem || isTransitioningQuestion) return;
        const playRect = document.getElementById('playArea').getBoundingClientRect();
        updateTempLine(e.clientX - playRect.left, e.clientY - playRect.top);
      });

      const onEnd = (e) => {
        if (!isDragging || dragSourceItem !== taskItem) return;
        try { cardEl.releasePointerCapture(e.pointerId); } catch (_) {}
        isDragging = false;
        cardEl.classList.remove('scale-105', 'ring-4', 'ring-candy-yellow');

        if (tempSvgLine) {
          tempSvgLine.remove();
          tempSvgLine = null;
        }

        evaluatePointerDrop(e.clientX, e.clientY, taskItem);
      };

      cardEl.addEventListener('pointerup', onEnd);
      cardEl.addEventListener('pointercancel', onEnd);
    }

    function updateTempLine(toX, toY) {
      if (!tempSvgLine) return;
      const sx = dragStartPoint.x;
      const sy = dragStartPoint.y;
      const dx = toX - sx;
      const pathData = `M ${sx} ${sy} C ${sx + dx * 0.4} ${sy}, ${toX - dx * 0.4} ${toY}, ${toX} ${toY}`;
      tempSvgLine.setAttribute('d', pathData);
    }

    function evaluatePointerDrop(clientX, clientY, taskItem) {
      if (!taskItem || !taskItem.targetEl || isTransitioningQuestion) return;
      sessionTotalTries++;

      const correctRect = taskItem.targetEl.getBoundingClientRect();
      const cx = correctRect.left + correctRect.width / 2;
      const cy = correctRect.top + correctRect.height / 2;
      const dist = Math.hypot(clientX - cx, clientY - cy);

      // Hitbox sasaran yang betul (65px)
      if (dist <= 65) {
        matchSuccess(taskItem);
        return;
      }

      // Adakah ditarik ke sasaran lain?
      let droppedOnOther = null;
      activeTaskItems.forEach(other => {
        if (other === taskItem || other.connected || !other.targetEl) return;
        const r = other.targetEl.getBoundingClientRect();
        const ocx = r.left + r.width / 2;
        const ocy = r.top + r.height / 2;
        if (Math.hypot(clientX - ocx, clientY - ocy) <= 65) {
          droppedOnOther = other;
        }
      });

      // Adakah ditarik ke kawasan tubuh watak secara am?
      const charBox = document.getElementById('characterBox');
      let droppedOnCharacterArea = false;
      if (charBox) {
        const cr = charBox.getBoundingClientRect();
        if (clientX >= cr.left - 25 && clientX <= cr.right + 25 &&
            clientY >= cr.top - 25 && clientY <= cr.bottom + 25) {
          droppedOnCharacterArea = true;
        }
      }

      // Jika ditarik ke sasaran lain atau ditarik ke kawasan watak tetapi tempat yang salah
      if (droppedOnOther || droppedOnCharacterArea) {
        matchMistake(taskItem);
      } else {
        // Jika hanya dilepaskan di kawasan kosong/asal (terlepas sentuhan), beri peluang tarik semula
        taskItem.sourceEl.classList.add('animate-wobble');
        setTimeout(() => taskItem.sourceEl.classList.remove('animate-wobble'), 600);
        setMascotMessage(ASSETS.mascot.pointing, I18N[currentLang].dragInstruction);
      }
    }

    function evaluateMatch(sourceItem, targetKey) {
      if (isTransitioningQuestion) return;
      sessionTotalTries++;
      if (sourceItem.sourceEl) sourceItem.sourceEl.classList.remove('ring-4', 'ring-candy-cyan');
      accessibleSelectedSource = null;

      if (sourceItem.key === targetKey) {
        matchSuccess(sourceItem);
      } else {
        matchMistake(sourceItem);
      }
    }

    function matchSuccess(item) {
      if (isTransitioningQuestion) return;
      item.connected = true;
      completedConnections++;
      sessionScore += 10;
      sessionCorrect++;

      AudioEngine.playSuccess();
      setMascotMessage(ASSETS.mascot.correct, I18N[currentLang].correctNudge);

      item.sourceEl.classList.add('opacity-90', 'ring-4', 'ring-candy-lime');
      item.sourceEl.style.cursor = 'default';

      item.targetEl.classList.add('scale-125');
      item.targetEl.style.filter = 'drop-shadow(0 0 12px #70E000)';

      drawPermanentConnection(item);

      if (completedConnections >= activeTaskItems.length) {
        setTimeout(handleTaskComplete, 800);
      }
    }

    function matchMistake(item) {
      if (isTransitioningQuestion) return;
      isTransitioningQuestion = true;

      AudioEngine.playMistake();
      setMascotMessage(ASSETS.mascot.mistake, I18N[currentLang].tryAgain);
      if (item && item.sourceEl) {
        item.sourceEl.classList.add('animate-wobble');
      }

      // Kunci interaksi sebentar sebelum beralih
      const playArea = document.getElementById('playArea');
      if (playArea) playArea.style.pointerEvents = 'none';

      // Beri kanak-kanak lihat animasi 800ms kemudian terus beralih ke soalan seterusnya
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentSessionMode !== 'free' && currentQuestionIndex >= totalQuestionsInSession) {
          renderResultView();
        } else {
          loadNextTask();
        }
      }, 850);
    }

    function drawPermanentConnection(item) {
      const playRect = document.getElementById('playArea').getBoundingClientRect();
      const pip = item.sourceEl.querySelector('.pip-dot') || item.sourceEl;
      const pipRect = pip.getBoundingClientRect();
      const targetRect = item.targetEl.getBoundingClientRect();

      const sx = (pipRect.left + pipRect.width / 2) - playRect.left;
      const sy = (pipRect.top + pipRect.height / 2) - playRect.top;
      const tx = (targetRect.left + targetRect.width / 2) - playRect.left;
      const ty = (targetRect.top + targetRect.height / 2) - playRect.top;

      const dx = tx - sx;
      const pathData = `M ${sx} ${sy} C ${sx + dx * 0.45} ${sy}, ${tx - dx * 0.45} ${ty}, ${tx} ${ty}`;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#00F0FF');
      path.setAttribute('stroke-width', '5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('filter', 'drop-shadow(0 0 6px rgba(0,240,255,0.8))');
      path.classList.add('connection-line');

      activeSvgOverlay.appendChild(path);
      item.permanentPath = path;
    }

    function recalculateConnections() {
      const playArea = document.getElementById('playArea');
      if (!playArea || !activeSvgOverlay) return;
      const playRect = playArea.getBoundingClientRect();

      activeTaskItems.forEach(item => {
        if (!item.connected || !item.permanentPath) return;
        const pip = item.sourceEl.querySelector('.pip-dot') || item.sourceEl;
        const pipRect = pip.getBoundingClientRect();
        const targetRect = item.targetEl.getBoundingClientRect();

        const sx = (pipRect.left + pipRect.width / 2) - playRect.left;
        const sy = (pipRect.top + pipRect.height / 2) - playRect.top;
        const tx = (targetRect.left + targetRect.width / 2) - playRect.left;
        const ty = (targetRect.top + targetRect.height / 2) - playRect.top;

        const dx = tx - sx;
        item.permanentPath.setAttribute('d', `M ${sx} ${sy} C ${sx + dx * 0.45} ${sy}, ${tx - dx * 0.45} ${ty}, ${tx} ${ty}`);
      });
    }

    function setMascotMessage(imgUrl, msg) {
      const img = document.getElementById('hudMascotImg');
      const text = document.getElementById('mascotMessage');
      if (img) img.src = imgUrl;
      if (text) text.textContent = msg;
    }

    function handleTaskComplete() {
      if (isTransitioningQuestion) return;
      isTransitioningQuestion = true;

      currentQuestionIndex++;
      AudioEngine.playSuccess();
      setMascotMessage(ASSETS.mascot.celebration, I18N[currentLang].greatJob);

      if (currentSessionMode !== 'free' && currentQuestionIndex >= totalQuestionsInSession) {
        setTimeout(renderResultView, 700);
      } else {
        setTimeout(loadNextTask, 600);
      }
    }

    function renderResultView() {
      const t = I18N[currentLang];
      const accuracy = sessionTotalTries > 0 ? Math.round((sessionCorrect / sessionTotalTries) * 100) : 100;

      userProfile.gamesPlayed++;
      userProfile.questionsAnswered += currentQuestionIndex;
      userProfile.correctAnswers += sessionCorrect;
      userProfile.totalAttempts += sessionTotalTries;
      if (sessionScore > userProfile.bestScore) userProfile.bestScore = sessionScore;
      userProfile.activities.unshift({
        date: new Date().toLocaleDateString(),
        score: sessionScore,
        accuracy: accuracy + "%"
      });
      if (userProfile.activities.length > 5) userProfile.activities.pop();
      saveProfileData(userProfile);

      appContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center w-full max-w-lg text-center py-6 animate-pop-in">
          <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-candy-yellow via-candy-pink to-candy-cyan p-1 shadow-2xl animate-bounce-soft mb-4">
            <div class="w-full h-full rounded-full bg-candy-dark flex items-center justify-center overflow-hidden">
              <img src="${ASSETS.mascot.celebration}" class="w-full h-full object-contain filter drop-shadow" alt="Celebration" onerror="handleImgError(this, 'mascot', 'celebration')">
            </div>
          </div>

          <div class="candy-title-tab w-full max-w-md px-6 py-3 rounded-2xl mb-5 shadow-2xl">
            <h2 class="text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-candy-yellow via-white to-candy-pink drop-shadow mb-0.5">
              ${t.greatJob}
            </h2>
            <p class="text-sm font-bold text-candy-cyan">
              ${t.gameComplete}
            </p>
          </div>

          <!-- Score Card Results -->
          <div class="candy-card w-full p-6 rounded-3xl grid grid-cols-3 gap-3 mb-7">
            <div class="flex flex-col items-center">
              <span class="text-xs md:text-sm font-bold text-candy-cream/70">${t.score}</span>
              <span class="text-2xl md:text-3xl font-extrabold text-candy-yellow">+${sessionScore}</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-xs md:text-sm font-bold text-candy-cream/70">${t.correctAnswers}</span>
              <span class="text-2xl md:text-3xl font-extrabold text-candy-lime">${sessionCorrect}</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-xs md:text-sm font-bold text-candy-cream/70">${t.accuracy}</span>
              <span class="text-2xl md:text-3xl font-extrabold text-candy-cyan">${accuracy}%</span>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-4 w-full px-4">
            <button id="btnPlayAgain" class="btn-candy-pink flex-1 py-4 rounded-2xl text-white font-extrabold text-lg shadow-lg">
              ${t.playAgain}
            </button>
            <button id="btnResultHome" class="btn-candy-purple flex-1 py-4 rounded-2xl text-white font-extrabold text-lg shadow-lg">
              ${t.backToMenu}
            </button>
          </div>
        </div>
      `;

      document.getElementById('btnPlayAgain').onclick = () => { AudioEngine.playPop(); startNewSession(); };
      document.getElementById('btnResultHome').onclick = () => { AudioEngine.playPop(); renderHomeView(); };
    }

    function renderProfileModal() {
      const t = I18N[currentLang];
      const acc = userProfile.totalAttempts > 0 ? Math.round((userProfile.correctAnswers / userProfile.totalAttempts) * 100) : 0;

      const html = `
        <h3 class="text-2xl font-extrabold text-candy-yellow mb-4">${t.btnProfile}</h3>
        
        <div class="space-y-4 text-left text-sm max-h-[60vh] overflow-y-auto pr-2">
          <div class="candy-card p-3 rounded-2xl">
            <label class="block font-bold text-candy-cyan mb-1">${t.studentNameLabel}</label>
            <input id="inputStudentName" type="text" value="${userProfile.studentName || ''}" placeholder="${t.studentNamePlaceholder}" class="w-full px-3 py-2 rounded-xl bg-candy-dark border border-candy-yellow/40 text-candy-cream font-bold focus:outline-none focus:ring-2 focus:ring-candy-yellow">
          </div>

          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="candy-card p-2 rounded-xl">
              <div class="text-xs text-candy-cream/70">${t.gamesPlayed}</div>
              <div class="text-lg font-extrabold text-candy-yellow">${userProfile.gamesPlayed}</div>
            </div>
            <div class="candy-card p-2 rounded-xl">
              <div class="text-xs text-candy-cream/70">${t.questionsAnswered}</div>
              <div class="text-lg font-extrabold text-candy-lime">${userProfile.questionsAnswered}</div>
            </div>
            <div class="candy-card p-2 rounded-xl">
              <div class="text-xs text-candy-cream/70">${t.bestScore}</div>
              <div class="text-lg font-extrabold text-candy-pink">${userProfile.bestScore}</div>
            </div>
            <div class="candy-card p-2 rounded-xl">
              <div class="text-xs text-candy-cream/70">${t.accuracy}</div>
              <div class="text-lg font-extrabold text-candy-cyan">${acc}%</div>
            </div>
          </div>

          <div class="candy-card p-3 rounded-2xl">
            <div class="text-xs text-candy-cream/70">${t.btnFamilyCode}:</div>
            <div class="text-base font-extrabold text-candy-yellow">${userProfile.familyCode || t.blankLabel}</div>
          </div>
        </div>

        <button id="btnSaveStudentName" class="mt-4 w-full py-2.5 rounded-xl btn-candy-pink font-extrabold text-white">
          ${t.save}
        </button>
      `;

      showModal(html);
      document.getElementById('btnSaveStudentName').onclick = () => {
        const val = document.getElementById('inputStudentName').value.trim();
        userProfile.studentName = val;
        saveProfileData(userProfile);
        AudioEngine.playPop();
        modalOverlay.classList.add('hidden');
      };
    }

    function renderFamilyCodeModal() {
      const t = I18N[currentLang];
      const html = `
        <h3 class="text-2xl font-extrabold text-candy-yellow mb-2">${t.btnFamilyCode}</h3>
        <p class="text-sm font-semibold text-candy-cyan mb-4">${t.familyCodePrompt}</p>

        <input id="inputFamilyCode" type="text" value="${userProfile.familyCode || ''}" placeholder="${t.codePlaceholder}" class="w-full px-4 py-3 rounded-2xl bg-candy-dark border-2 border-candy-yellow text-candy-cream text-center font-extrabold text-lg tracking-widest focus:outline-none focus:ring-4 focus:ring-candy-cyan mb-4">

        <button id="btnSaveFamilyCode" class="w-full py-3 rounded-2xl btn-candy-blue font-extrabold text-white text-base">
          ${t.save}
        </button>
      `;

      showModal(html);
      document.getElementById('btnSaveFamilyCode').onclick = () => {
        const val = document.getElementById('inputFamilyCode').value.trim();
        userProfile.familyCode = val;
        saveProfileData(userProfile);
        AudioEngine.playPop();
        modalOverlay.classList.add('hidden');
      };
    }

    function renderCollectionModal() {
      const t = I18N[currentLang];
      const keys = Object.keys(ASSETS.bodyParts);
      let itemsHtml = '';

      keys.forEach(k => {
        const part = ASSETS.bodyParts[k];
        itemsHtml += `
          <div class="candy-card p-2 rounded-2xl flex flex-col items-center justify-center text-center">
            <img src="${part.url}" alt="${getPartLabel(part)}" class="w-14 h-14 object-contain rounded-xl bg-candy-dark/60 p-1 mb-1 border border-candy-yellow/30" onerror="handleImgError(this, 'part', '${k}')">
            <span class="text-xs font-bold text-candy-cream truncate w-full">${getPartLabel(part)}</span>
          </div>
        `;
      });

      const html = `
        <h3 class="text-2xl font-extrabold text-candy-yellow mb-2">${t.collectionTitle}</h3>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 max-h-[60vh] overflow-y-auto p-1">
          ${itemsHtml}
        </div>
      `;

      showModal(html);
    }

    function renderHowToPlayModal() {
      const t = I18N[currentLang];
      const html = `
        <h3 class="text-2xl font-extrabold text-candy-yellow mb-2">${t.howToPlayTitle}</h3>
        <p class="text-base font-bold text-candy-cream mb-4">${t.howToPlayInstruction}</p>

        <div class="candy-card p-4 rounded-2xl flex items-center justify-around mb-2">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-xl bg-candy-pink flex items-center justify-center text-white font-extrabold">
              <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            </div>
            <span class="text-xs font-bold mt-1 text-candy-yellow">${t.howToPlayPartSample}</span>
          </div>

          <svg viewBox="0 0 100 40" class="w-24 h-10">
            <path d="M 10 20 C 40 5, 60 35, 90 20" fill="none" stroke="#FFD200" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round">
              <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" repeatCount="indefinite"/>
            </path>
            <polygon points="90,20 80,14 80,26" fill="#FFD200"/>
          </svg>

          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full border-2 border-candy-cyan flex items-center justify-center target-marker-pulse">
              <div class="w-4 h-4 rounded-full bg-candy-lime"></div>
            </div>
            <span class="text-xs font-bold mt-1 text-candy-cyan">${t.howToPlayTargetSample}</span>
          </div>
        </div>
      `;

      showModal(html);
    }

    btnLangToggle.onclick = () => {
      AudioEngine.playPop();
      currentLang = currentLang === 'ms' ? 'en' : 'ms';
      renderHomeView();
    };

    btnAudioToggle.onclick = () => {
      soundEnabled = !soundEnabled;
      iconAudioOn.classList.toggle('hidden', !soundEnabled);
      iconAudioOff.classList.toggle('hidden', soundEnabled);
      AudioEngine.playPop();
    };

    btnLogoHome.onclick = () => {
      AudioEngine.playPop();
      renderHomeView();
    };

    btnOpenProfile.onclick = () => {
      AudioEngine.playPop();
      renderProfileModal();
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderHomeView();
    });
  </script>
</body>
</html>
